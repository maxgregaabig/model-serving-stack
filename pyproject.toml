[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-serving-stack"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["api", "triton", "vllm"]

[tool.ruff]
line-length = 100
exclude = ["triton/model_repository/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["gpu: marks tests that require a GPU"]

[tool.coverage.run]
omit = [
    "evals/benchmark.py",
    "vllm/server.py",
    "vllm/openai_server.py",
    "vllm/client_test.py",
]
